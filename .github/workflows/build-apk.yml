name: Build SaarthiAI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip saarthiai.zip
        run: |
          unzip -o saarthiai.zip -d app_src
          if [ -f "app_src/package.json" ]; then
            cp -r app_src/* .
          else
            SUBDIR=$(find app_src -maxdepth 2 -name "package.json" -exec dirname {} \; | head -n 1)
            cp -r "$SUBDIR"/* .
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor Android & Fix Crash Issues
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.json
          WEB_DIR="dist"
          if [ -d "build" ]; then WEB_DIR="build"; fi
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.saarthiai.app",
            "appName": "SaarthiAI",
            "webDir": "$WEB_DIR",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          
          # Add Google AdMob Test App ID & Internet Permission to prevent startup crash
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<\/application>/<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/><\/application>/g' $MANIFEST
          
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload SaarthiAI APK
        uses: actions/upload-artifact@v4
        with:
          name: SaarthiAI-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
